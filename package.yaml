name:                hparser2
version:             0.1.0.0
github:              "githubuser/hparser2"
license:             BSD-3-Clause
author:              "Hohyun Kim"
maintainer:          "skykim63@gmail.com"
copyright:           "2026 Hohyun Kim"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/hparser2#readme>

dependencies:
- base >= 4.7 && < 5
- text
- bytestring
- containers
- aeson
- optparse-applicative
- mtl
- megaparsec
- pretty-simple

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  hparser2-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hparser2

tests:
  hparser2-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hparser2
